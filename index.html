<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aviator Game - Premium</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0a0a1a 100%);
            color: white;
            padding: 12px;
            min-height: 100vh;
            overflow-y: auto;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Stats Grid - Compact */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 8px 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 2px;
        }

        .balance-value { color: #fbbf24; }
        .bet-value { color: #f97316; }
        .win-value { color: #10b981; }

        /* Plane Card - Smaller */
        .plane-card {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-radius: 32px;
            padding: 12px;
            margin-bottom: 10px;
            border: 2px solid rgba(249, 115, 22, 0.4);
        }

        .sky-container {
            position: relative;
            height: 80px;
            margin-bottom: 10px;
            overflow: hidden;
            border-radius: 20px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .cloud1 { width: 40px; height: 25px; top: 15px; left: -50px; animation: floatCloud 15s linear infinite; }
        .cloud2 { width: 55px; height: 30px; top: 45px; left: -70px; animation: floatCloud 25s linear infinite; animation-delay: 5s; }
        @keyframes floatCloud {
            from { left: -100px; }
            to { left: 100%; }
        }

        .plane {
            position: absolute;
            bottom: 12px;
            left: -60px;
            font-size: 36px;
            transition: left 0.05s linear;
            filter: drop-shadow(0 0 8px rgba(249,115,22,0.5));
            z-index: 10;
        }
        .plane.flying { animation: planeFly 0.3s infinite alternate; }
        @keyframes planeFly {
            from { transform: translateY(0px); }
            to { transform: translateY(-4px); }
        }
        .flight-path {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f97316, #f97316, transparent);
            opacity: 0.4;
        }

        .multiplier {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #f97316, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-family: monospace;
            text-align: center;
        }
        .multiplier-label {
            font-size: 10px;
            color: #64748b;
            text-align: center;
        }

        /* Countdown + History Row */
        .info-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .countdown-box {
            flex: 0.8;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border-radius: 24px;
            padding: 10px;
            text-align: center;
        }
        .history-box {
            flex: 2;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 8px;
            overflow: hidden;
        }

        .countdown-circle {
            width: 55px;
            height: 55px;
            margin: 0 auto;
            position: relative;
        }
        .countdown-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
        }
        canvas { width: 55px; height: 55px; }

        .bet-phase-text {
            font-size: 9px;
            margin-top: 5px;
            padding: 2px 8px;
            display: inline-block;
            border-radius: 20px;
        }
        .bet-allowed { background: #10b98120; color: #10b981; animation: pulse 1s infinite; }
        .bet-closed { background: #ef444420; color: #ef4444; }
        @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.6;} }

        .history-title {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .history-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
        }
        .history-item {
            background: #0f172a;
            border-radius: 12px;
            padding: 6px 10px;
            min-width: 85px;
            display: inline-block;
            text-align: center;
        }
        .history-multiplier { color: #f97316; font-weight: bold; font-size: 12px; }
        .history-win { font-size: 10px; }
        .win-text { color: #10b981; }
        .loss-text { color: #ef4444; }

        /* Max Bet Indicator */
        .max-bet-indicator {
            background: #f9731620;
            border-radius: 30px;
            padding: 4px 10px;
            text-align: center;
            font-size: 10px;
            color: #f97316;
            margin-bottom: 8px;
        }

        /* Bet Section - Compact */
        .bet-section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .dual-bet-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .bet-card {
            flex: 1;
            background: #0f172a;
            border-radius: 20px;
            padding: 10px;
            text-align: center;
        }
        .bet-icon { font-size: 24px; }
        .bet-label { font-size: 10px; color: #94a3b8; }
        .bet-input {
            width: 100%;
            padding: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 40px;
            color: white;
            margin: 8px 0;
        }
        .quick-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-btn {
            background: #334155;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 8px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; }
        .next-bet-card {
            background: #3b82f620;
            border-radius: 16px;
            padding: 8px;
            margin-top: 8px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }
        .player-id {
            text-align: center;
            font-size: 8px;
            color: #475569;
            margin-top: 8px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 12px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">💰 BALANCE</div><div class="stat-value balance-value" id="mainBalance">20000</div></div>
        <div class="stat-card"><div class="stat-label">🎲 TOTAL BET</div><div class="stat-value bet-value" id="totalBet">0</div></div>
        <div class="stat-card"><div class="stat-label">🏆 MULTIPLIER</div><div class="stat-value win-value" id="currentMultiplierShow">1.00x</div></div>
    </div>

    <!-- Plane + Multiplier -->
    <div class="plane-card">
        <div class="sky-container" id="skyContainer">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="flight-path"></div>
            <div class="plane" id="plane">✈️</div>
        </div>
        <div class="multiplier" id="multiplier">1.00</div>
        <div class="multiplier-label">✈️ CURRENT MULTIPLIER</div>
    </div>

    <!-- Countdown + History Row (No extra scroll) -->
    <div class="info-row">
        <div class="countdown-box">
            <div class="countdown-circle">
                <canvas id="countdownCanvas" width="55" height="55"></canvas>
                <div class="countdown-number" id="countdownNumber">0</div>
            </div>
            <div><span class="bet-phase-text" id="betPhaseText">⚡ BET NOW</span></div>
            <div style="font-size: 8px; color:#64748b;" id="roundStatusText">Waiting...</div>
        </div>
        <div class="history-box">
            <div class="history-title"><span>📜 RECENT</span><span>Last 5</span></div>
            <div class="history-list" id="historyList">
                <div style="color:#64748b; font-size:10px;">No history</div>
            </div>
        </div>
    </div>

    <!-- Max Bet Limit -->
    <div class="max-bet-indicator" id="maxBetIndicator">💰 Max Bet: Loading...</div>

    <!-- Bet Section -->
    <div class="bet-section">
        <div class="dual-bet-row">
            <div class="bet-card">
                <div class="bet-icon">🐓</div>
                <div class="bet-label">SMALL</div>
                <input type="number" id="smallBet" class="bet-input" value="100">
                <div class="quick-btns">
                    <span class="quick-btn" onclick="setBet('small',100)">+100</span>
                    <span class="quick-btn" onclick="setBet('small',500)">+500</span>
                    <span class="quick-btn" onclick="setBet('small',1000)">1K</span>
                    <span class="quick-btn" onclick="setBet('small','half')">½</span>
                    <span class="quick-btn" onclick="setBet('small','max')">MAX</span>
                </div>
            </div>
            <div class="bet-card">
                <div class="bet-icon">🦅</div>
                <div class="bet-label">BIG</div>
                <input type="number" id="bigBet" class="bet-input" value="200">
                <div class="quick-btns">
                    <span class="quick-btn" onclick="setBet('big',100)">+100</span>
                    <span class="quick-btn" onclick="setBet('big',500)">+500</span>
                    <span class="quick-btn" onclick="setBet('big',1000)">1K</span>
                    <span class="quick-btn" onclick="setBet('big','half')">½</span>
                    <span class="quick-btn" onclick="setBet('big','max')">MAX</span>
                </div>
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-primary" id="placeBetBtn" disabled>✈️ BET</button>
            <button class="btn btn-danger" id="cashoutBtn" disabled>💸 CASHOUT</button>
        </div>
        <button class="btn btn-secondary" id="nextRoundBetBtn">⏩ NEXT ROUND AUTO-BET</button>
        <div class="next-bet-card" id="nextBetIndicator">📌 No next round bet</div>
    </div>

    <div class="player-id" id="playerId"></div>
</div>

<script>
    // ========== FIREBASE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCVH6du7PQIvT3Y5nnuWeUo3MU3-30KOok",
        authDomain: "aviator-realtime.firebaseapp.com",
        databaseURL: "https://aviator-realtime-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "aviator-realtime",
        storageBucket: "aviator-realtime.firebasestorage.app",
        messagingSenderId: "740588905160",
        appId: "1:740588905160:web:94cb8cd70cf1abca7ebbfd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ========== SOUNDS ==========
    function playBeep(freq, dur, vol=0.3){
        try{
            const ac = new (AudioContext||webkitAudioContext)();
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.frequency.value = freq;
            gain.gain.value = vol;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + dur);
            osc.stop(ac.currentTime + dur);
            if(ac.state === 'suspended') ac.resume();
        }catch(e){}
    }
    function playRoundStart(){ playBeep(880,0.3,0.4); setTimeout(()=>playBeep(660,0.3,0.3),150); }
    function playCrash(){ playBeep(220,0.5,0.5); setTimeout(()=>playBeep(180,0.4,0.4),200); }
    function playCashout(){ playBeep(1000,0.15,0.3); setTimeout(()=>playBeep(1200,0.15,0.3),100); setTimeout(()=>playBeep(1400,0.2,0.3),200); }
    function playBet(){ playBeep(600,0.1,0.2); }
    function playTick(){ playBeep(440,0.08,0.15); }

    // ========== GAME STATE ==========
    const playerId = "p_" + Math.random().toString(36).substring(2,8) + Date.now();
    let balance = 20000, smallBet=0, bigBet=0, totalBet=0, hasBet=false;
    let roundActive=false, canBet=true, multiplier=1.00, roundId=null, interval=null;
    let nextRound = {small:0, big:0}, history=[], maxBet=300000;

    // DOM
    const balanceEl = document.getElementById('mainBalance');
    const totalEl = document.getElementById('totalBet');
    const multiplierEl = document.getElementById('multiplier');
    const multiplierShow = document.getElementById('currentMultiplierShow');
    const placeBtn = document.getElementById('placeBetBtn');
    const cashBtn = document.getElementById('cashoutBtn');
    const smallInput = document.getElementById('smallBet');
    const bigInput = document.getElementById('bigBet');
    const historyDiv = document.getElementById('historyList');
    const nextIndicator = document.getElementById('nextBetIndicator');
    const countdownNum = document.getElementById('countdownNumber');
    const phaseText = document.getElementById('betPhaseText');
    const roundStatus = document.getElementById('roundStatusText');
    const plane = document.getElementById('plane');
    const maxIndicator = document.getElementById('maxBetIndicator');

    // Canvas
    const canvas = document.getElementById('countdownCanvas');
    const ctx = canvas.getContext('2d');
    function drawCircle(percent){
        canvas.width=55; canvas.height=55;
        ctx.clearRect(0,0,55,55);
        ctx.beginPath();
        ctx.arc(27.5,27.5,23,0,2*Math.PI);
        ctx.strokeStyle='#334155';
        ctx.lineWidth=4;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(27.5,27.5,23,-Math.PI/2,-Math.PI/2+(2*Math.PI*percent));
        ctx.strokeStyle='#3b82f6';
        ctx.stroke();
    }

    // Plane animation
    function animatePlane(val){
        if(!roundActive) return;
        const cont = document.getElementById('skyContainer');
        const w = cont ? cont.offsetWidth : 280;
        let prog = Math.min(val/10, 0.85);
        plane.style.left = (prog * w) + 'px';
        plane.classList.add('flying');
    }
    function resetPlane(){ plane.style.left='-60px'; plane.classList.remove('flying'); }

    function showToast(msg, err=false){
        let t = document.createElement('div');
        t.className='toast';
        t.style.background=err?'#dc2626':'#10b981';
        t.innerText=msg;
        document.body.appendChild(t);
        setTimeout(()=>t.remove(),2000);
    }

    function updateUI(){
        balanceEl.innerText = Math.floor(balance);
        totalEl.innerText = totalBet;
        db.ref('users/'+playerId).set({balance:Math.floor(balance)});
    }

    function updateHistory(){
        if(history.length===0){
            historyDiv.innerHTML = '<div style="color:#64748b;font-size:10px;">No history</div>';
            return;
        }
        historyDiv.innerHTML = history.slice(-5).reverse().map(h => `
            <div class="history-item">
                <div class="history-multiplier">${h.multiplier}x</div>
                <div class="history-win ${h.win>0?'win-text':'loss-text'}">${h.win>0?'+'+h.win.toFixed(0):'-'+Math.abs(h.win)}</div>
                <div style="font-size:8px;color:#64748b;">${h.round}</div>
            </div>
        `).join('');
    }

    window.setBet = function(type, amt){
        let bal = balance;
        if(amt==='half') amt = Math.floor(bal/2);
        if(amt==='max') amt = Math.min(bal, maxBet);
        if(type==='small') smallInput.value = Math.min(amt, bal, maxBet);
        else bigInput.value = Math.min(amt, bal, maxBet);
    }

    async function loadMax(){
        const snap = await db.ref('game/settings/maxBet').once('value');
        maxBet = snap.exists() ? snap.val() : 300000;
        maxIndicator.innerHTML = `💰 Max Bet: ₹${maxBet.toLocaleString()}`;
    }

    async function placeBets(){
        if(!canBet){ showToast("Bet only during countdown!",true); return; }
        if(roundActive){ showToast("Round live!",true); return; }
        await loadMax();
        let s = parseInt(smallInput.value)||0;
        let b = parseInt(bigInput.value)||0;
        if(s>maxBet){ showToast(`Small max ₹${maxBet.toLocaleString()}`,true); return; }
        if(b>maxBet){ showToast(`Big max ₹${maxBet.toLocaleString()}`,true); return; }
        if(s<=0 && b<=0){ showToast("Enter bet!",true); return; }
        let total = s+b;
        if(total>balance){ showToast("Low balance!",true); return; }
        smallBet=s; bigBet=b; totalBet=total;
        balance-=total; hasBet=true;
        updateUI(); playBet();
        showToast(`✅ Bet ₹${s}+₹${b} placed`);
        placeBtn.disabled=true;
    }

    function cashout(){
        if(!hasBet || !roundActive){ showToast("No active bet!",true); return; }
        let win = totalBet * multiplier;
        balance += win;
        updateUI(); playCashout();
        history.unshift({ round:"#"+(roundId||'').toString().slice(-5), multiplier:multiplier.toFixed(2), win:win });
        updateHistory();
        showToast(`🎉 Won ₹${win.toFixed(0)} at ${multiplier.toFixed(2)}x`);
        hasBet=false; totalBet=0; cashBtn.disabled=true;
    }

    function setNext(){
        let s = parseInt(smallInput.value)||0;
        let b = parseInt(bigInput.value)||0;
        if(s<=0 && b<=0){ showToast("Enter amount first!",true); return; }
        if(s>maxBet || b>maxBet){ showToast(`Max limit ₹${maxBet.toLocaleString()}`,true); return; }
        nextRound={small:s, big:b};
        nextIndicator.innerHTML = `📌 Next: S:₹${s} B:₹${b} (Auto)`;
        showToast("Next round bet saved!");
    }

    function autoNext(){
        if(nextRound.small>0 || nextRound.big>0){
            let total = nextRound.small+nextRound.big;
            if(total<=balance){
                smallBet=nextRound.small; bigBet=nextRound.big; totalBet=total;
                balance-=total; hasBet=true; updateUI();
                showToast(`🤖 Auto-bet S:₹${nextRound.small} B:₹${nextRound.big}`);
                placeBtn.disabled=true;
                nextRound={small:0,big:0};
                nextIndicator.innerHTML="📌 No next round bet";
            }else showToast("Auto-bet failed: Low balance",true);
        }
    }

    // Firebase Listener
    db.ref('game/currentRound').on('value', (snap)=>{
        const r = snap.val();
        if(!r) return;
        if(r.status==='countdown' && r.countdown!==undefined){
            canBet=true;
            phaseText.innerHTML='⚡ BET NOW';
            phaseText.className='bet-phase-text bet-allowed';
            roundStatus.innerHTML='Place bets!';
            placeBtn.disabled=false;
            drawCircle(r.countdown/5);
            countdownNum.innerText=r.countdown;
            if(r.countdown<=5 && r.countdown>0) playTick();
            resetPlane();
        }
        else if(r.active===true && r.id!==roundId){
            canBet=false;
            roundActive=true;
            roundId=r.id;
            multiplier=1.00;
            multiplierEl.innerText="1.00";
            multiplierShow.innerText="1.00x";
            phaseText.innerHTML='🔴 BET CLOSED';
            phaseText.className='bet-phase-text bet-closed';
            roundStatus.innerHTML='✈️ LIVE!';
            placeBtn.disabled=true;
            cashBtn.disabled=!hasBet;
            drawCircle(0);
            countdownNum.innerText="GO!";
            playRoundStart();
            if(!hasBet && (nextRound.small>0||nextRound.big>0)) autoNext();
            if(interval) clearInterval(interval);
            interval = setInterval(()=>{
                if(roundActive){
                    let inc = 0.02 + Math.random()*0.07;
                    multiplier = parseFloat((multiplier+inc).toFixed(2));
                    multiplierEl.innerText=multiplier.toFixed(2);
                    multiplierShow.innerText=multiplier.toFixed(2)+"x";
                    animatePlane(multiplier);
                    if(multiplier >= r.target){
                        clearInterval(interval);
                        roundActive=false;
                        roundStatus.innerHTML=`💥 Crashed at ${multiplier.toFixed(2)}x`;
                        playCrash();
                        if(hasBet){
                            showToast(`💥 Lost ₹${totalBet}`,true);
                            history.unshift({ round:"#"+roundId.toString().slice(-5), multiplier:multiplier.toFixed(2), win:-totalBet });
                            updateHistory();
                            hasBet=false; totalBet=0; cashBtn.disabled=true; updateUI();
                        }
                        db.ref('game/currentRound/active').set(false);
                        setTimeout(resetPlane,800);
                    }
                }
            },180);
        }
        else if(r.active===false && roundActive===true){
            clearInterval(interval);
            roundActive=false;
            if(hasBet){
                showToast(`Round ended - Lost bets`,true);
                hasBet=false; totalBet=0; cashBtn.disabled=true; updateUI();
            }
            resetPlane();
        }
    });

    // Init
    async function init(){
        await loadMax();
        const snap = await db.ref('users/'+playerId).once('value');
        if(snap.exists() && snap.val().balance) balance = snap.val().balance;
        updateUI();
        document.getElementById('playerId').innerText = "ID: "+playerId.slice(-8);
        drawCircle(0);
    }
    init();
    placeBtn.onclick = placeBets;
    cashBtn.onclick = cashout;
    document.getElementById('nextRoundBetBtn').onclick = setNext;
    setInterval(loadMax, 5000);
</script>
</body>
</html>
